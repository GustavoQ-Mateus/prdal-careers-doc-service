name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      imagem: ${{ steps.contexto.outputs.proprio }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar
        run: |
          dotnet restore
          dotnet restore tests
      - name: Verificar texto
        run: dotnet run --project scripts/verificar-texto.csproj
      - name: Compilar e testar
        run: |
          dotnet build -c Release --no-restore
          dotnet test tests -c Release --no-restore
      - name: Conferir contexto proprio
        id: contexto
        run: |
          if [ -f .contexto-proprio ]; then
            echo "proprio=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Construir imagem
        if: steps.contexto.outputs.proprio == 'true'
        run: docker build -t unidade:${{ github.sha }} .
      - name: Verificar vulnerabilidades
        if: steps.contexto.outputs.proprio == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: unidade:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Salvar imagem verificada
        if: steps.contexto.outputs.proprio == 'true'
        run: docker save unidade:${{ github.sha }} -o "${{ runner.temp }}/imagem.tar"
      - uses: actions/upload-artifact@v4
        if: steps.contexto.outputs.proprio == 'true'
        with:
          name: imagem
          path: ${{ runner.temp }}/imagem.tar
          retention-days: 1
